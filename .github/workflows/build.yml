name: Build FPSBoost
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tulis source code
        run: |
          mkdir -p jni include
          cat > jni/fpsboost.cpp << 'SRC_EOF'
          #include <mod/amlmod.h>
          #include <mod/logger.h>
          #include <mod/config.h>
          #include <stdint.h>
          #include <pthread.h>
          #include <unistd.h>

          MYMODCFG(net.gua.fpsboost, FPS Boost, 1.0, gua)

          static void*   hGTASA  = nullptr;
          static int     g_maxFPS = 60;

          #define RSGLOBAL_MAXFPS_OFFSET 0x14

          static void* FPSThread(void*)
          {
              void* rsGlobal = nullptr;
              for (int i = 0; i < 60 && !rsGlobal; ++i)
              {
                  sleep(1);
                  rsGlobal = aml->GetSym(hGTASA, "RsGlobal");
              }
              if (!rsGlobal) { logger->Error("FPSBoost: simbol RsGlobal tidak ketemu"); return nullptr; }

              unsigned int* maxFPS = (unsigned int*)((uintptr_t)rsGlobal + RSGLOBAL_MAXFPS_OFFSET);
              logger->Info("FPSBoost: maxFPS awal = %u", *maxFPS);

              while (true)
              {
                  if (*maxFPS != (unsigned int)g_maxFPS) *maxFPS = g_maxFPS;
                  sleep(1);
              }
              return nullptr;
          }

          extern "C" void OnModLoad()
          {
              logger->SetTag("FPSBoost");
              g_maxFPS = cfg->Bind("MaxFPS", 60, "Main")->GetInt();
              if (g_maxFPS < 30)  g_maxFPS = 30;
              if (g_maxFPS > 120) g_maxFPS = 120;
              cfg->Save();

              hGTASA = aml->GetLibHandle("libGTASA.so");
              if (!hGTASA) { logger->Error("libGTASA.so tidak ditemukan"); return; }

              pthread_t t;
              pthread_create(&t, nullptr, FPSThread, nullptr);
              pthread_detach(t);
          }
          SRC_EOF
          cat > jni/Android.mk << 'SRC_EOF'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE    := FPSBoost
          LOCAL_SRC_FILES := fpsboost.cpp
          LOCAL_C_INCLUDES += $(LOCAL_PATH)/../include
          LOCAL_CPPFLAGS  += -std=c++17 -O2 -fvisibility=hidden
          LOCAL_LDLIBS    := -llog
          include $(BUILD_SHARED_LIBRARY)
          SRC_EOF
          cat > jni/Application.mk << 'SRC_EOF'
          APP_ABI      := armeabi-v7a
          APP_PLATFORM := android-21
          APP_STL      := c++_static
          APP_CPPFLAGS += -I/tmp/aml -I/tmp/aml/include
          SRC_EOF
      - name: Ambil header AML
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader /tmp/aml
          find /tmp/aml -name amlmod.h
          AMLH=$(find /tmp/aml -name amlmod.h | head -n 1)
          test -n "$AMLH"
          mkdir -p include/mod
          cp -r "$(dirname "$AMLH")"/* include/mod/
      - name: Build
        run: $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
      - uses: actions/upload-artifact@v4
        with:
          name: libFPSBoost
          path: libs/armeabi-v7a/libFPSBoost.so
